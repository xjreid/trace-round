spring.application.name=traceround-backend

server.port=${PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.name=TRACEROUND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/traceround}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:traceround}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:traceround-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

traceround.frontend-url=${FRONTEND_URL:http://localhost:5173}
traceround.code-execution.provider=${CODE_EXECUTION_PROVIDER:jdoodle}
traceround.code-runner.base-url=${CODE_RUNNER_BASE_URL:http://localhost:8090}
traceround.code-runner.timeout-seconds=${CODE_RUNNER_TIMEOUT_SECONDS:8}
traceround.code-execution.judge0.base-url=${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
traceround.code-execution.judge0.api-key=${JUDGE0_API_KEY:}
traceround.code-execution.judge0.api-host=${JUDGE0_API_HOST:judge0-ce.p.rapidapi.com}
traceround.code-execution.judge0.auth-mode=${JUDGE0_AUTH_MODE:rapidapi}
traceround.code-execution.judge0.poll-interval-millis=${JUDGE0_POLL_INTERVAL_MILLIS:350}
traceround.code-execution.judge0.poll-timeout-seconds=${JUDGE0_POLL_TIMEOUT_SECONDS:12}
traceround.code-execution.judge0.cpu-time-limit-seconds=${JUDGE0_CPU_TIME_LIMIT_SECONDS:5}
traceround.code-execution.judge0.max-output-characters=${JUDGE0_MAX_OUTPUT_CHARACTERS:32768}
traceround.code-execution.judge0.javascript-language-id=${JUDGE0_JAVASCRIPT_LANGUAGE_ID:63}
traceround.code-execution.judge0.python-language-id=${JUDGE0_PYTHON_LANGUAGE_ID:71}
traceround.code-execution.judge0.java-language-id=${JUDGE0_JAVA_LANGUAGE_ID:62}
traceround.code-execution.judge0.cpp-language-id=${JUDGE0_CPP_LANGUAGE_ID:54}
traceround.code-execution.jdoodle.base-url=${JDOODLE_API_URL:https://api.jdoodle.com/v1}
traceround.code-execution.jdoodle.client-id=${JDOODLE_CLIENT_ID:}
traceround.code-execution.jdoodle.client-secret=${JDOODLE_CLIENT_SECRET:}
traceround.code-execution.jdoodle.max-output-characters=${JDOODLE_MAX_OUTPUT_CHARACTERS:32768}
traceround.code-execution.jdoodle.javascript-language=${JDOODLE_JAVASCRIPT_LANGUAGE:nodejs}
traceround.code-execution.jdoodle.javascript-version-index=${JDOODLE_JAVASCRIPT_VERSION_INDEX:5}
traceround.code-execution.jdoodle.python-language=${JDOODLE_PYTHON_LANGUAGE:python3}
traceround.code-execution.jdoodle.python-version-index=${JDOODLE_PYTHON_VERSION_INDEX:5}
traceround.code-execution.jdoodle.java-language=${JDOODLE_JAVA_LANGUAGE:java}
traceround.code-execution.jdoodle.java-version-index=${JDOODLE_JAVA_VERSION_INDEX:5}
traceround.code-execution.jdoodle.cpp-language=${JDOODLE_CPP_LANGUAGE:cpp17}
traceround.code-execution.jdoodle.cpp-version-index=${JDOODLE_CPP_VERSION_INDEX:2}
traceround.code-execution.quotas.enabled=${CODE_EXECUTION_QUOTAS_ENABLED:true}
traceround.code-execution.quotas.daily-submissions=${CODE_EXECUTION_DAILY_SUBMISSIONS:45}
traceround.code-execution.quotas.jdoodle-daily-submissions=${JDOODLE_DAILY_SUBMISSIONS:18}
traceround.code-execution.quotas.ip-submissions-per-day=${CODE_EXECUTION_IP_SUBMISSIONS_PER_DAY:20}
traceround.code-execution.quotas.account-submissions-per-day=${CODE_EXECUTION_ACCOUNT_SUBMISSIONS_PER_DAY:30}
traceround.code-execution.quotas.ip-submissions-per-minute=${CODE_EXECUTION_IP_SUBMISSIONS_PER_MINUTE:5}
traceround.code-execution.quotas.account-submissions-per-minute=${CODE_EXECUTION_ACCOUNT_SUBMISSIONS_PER_MINUTE:10}
traceround.code-execution.quotas.reset-zone=${CODE_EXECUTION_RESET_ZONE:UTC}
traceround.ai.provider=${TRACEROUND_AI_PROVIDER:mock}
traceround.ai.api-key=${TRACEROUND_AI_API_KEY:}
traceround.ai.model=${TRACEROUND_AI_MODEL:}
traceround.ai.timeout-seconds=${TRACEROUND_AI_TIMEOUT_SECONDS:30}
traceround.ai.gemini.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
traceround.ai.quotas.enabled=${AI_QUOTAS_ENABLED:true}
traceround.ai.quotas.daily-units=${AI_DAILY_QUOTA_UNITS:1000}
traceround.ai.quotas.max-messages-per-question=${AI_MAX_MESSAGES_PER_QUESTION:6}
traceround.ai.quotas.ip-interviews-per-hour=${AI_IP_INTERVIEWS_PER_HOUR:10}
traceround.ai.quotas.account-interviews-per-hour=${AI_ACCOUNT_INTERVIEWS_PER_HOUR:20}
traceround.ai.quotas.ip-messages-per-minute=${AI_IP_MESSAGES_PER_MINUTE:20}
traceround.ai.quotas.account-messages-per-minute=${AI_ACCOUNT_MESSAGES_PER_MINUTE:30}
traceround.ai.quotas.hash-salt=${AI_QUOTA_HASH_SALT:traceround-local-only}

# Activate configured providers with oauth-google and/or oauth-github in
# SPRING_PROFILES_ACTIVE.
