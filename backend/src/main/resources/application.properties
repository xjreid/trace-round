spring.application.name=traceround-backend

server.port=${PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.name=TRACEROUND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/traceround}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:traceround}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:traceround-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

traceround.frontend-url=${FRONTEND_URL:http://localhost:5173}
traceround.code-runner.base-url=${CODE_RUNNER_BASE_URL:http://localhost:8090}
traceround.code-runner.timeout-seconds=${CODE_RUNNER_TIMEOUT_SECONDS:8}
traceround.ai.provider=${TRACEROUND_AI_PROVIDER:mock}
traceround.ai.api-key=${TRACEROUND_AI_API_KEY:}
traceround.ai.model=${TRACEROUND_AI_MODEL:}

# Activate configured providers with oauth-google and/or oauth-github in
# SPRING_PROFILES_ACTIVE.
